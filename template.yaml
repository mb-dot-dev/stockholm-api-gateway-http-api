AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless application with producer Lambda function

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project
  FunctionName:
    Type: String
    Description: Name of the producer Lambda function
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN of the existing IAM role for the producer Lambda execution
  
  AllowedClientId:
    Type: String
    Description: Name of the SSM String parameter holding the JWT sub claim value of the single allowed client
    Default: /projects/stockholm/allowed-client-id
  AllowedIps:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Description: Name of the SSM StringList parameter holding the allowed source IP addresses
    Default: /allowed-ips/all
  QueueUrl:
    Type: AWS::SSM::Parameter::Value<String>
    Description: URL of the existing SQS queue
    Default: /sqs/oslo/queue-url

Outputs:
  FunctionArn:
    Description: ARN of the producer Lambda function
    Value: !GetAtt Function.Arn

  FunctionName:
    Description: Name of the producer Lambda function
    Value: !Ref FunctionName

Resources:
  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.15
      Handler: app.main.lambda_handler
      CodeUri: lambda.zip
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Ref FunctionName
          POWERTOOLS_LOG_LEVEL: INFO
          QUEUE_URL: !Ref QueueUrl
          ALLOWED_IPS: !Join [",", !Ref AllowedIps]
          ALLOWED_CLIENT_ID: !Ref AllowedClientId
      Tags:
        Project: !Ref ProjectName
        Name: !Ref FunctionName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "/aws/lambda/${FunctionName}"

